[package]
name = "warren-snail"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Kenneth Allen Flegal"]
description = "A database in one file, read a column at a time, declared and asked in PostgreSQL's SQL"
rust-version = "1.88"
repository = "https://github.com/soulstompp/warren-snail"
readme = "README.md"
keywords = ["database", "parquet", "postgresql", "sql", "columnar"]
categories = ["database-implementations", "command-line-utilities"]
include = ["build.rs", "src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[lib]
name = "warren_snail"
path = "src/lib.rs"

[[bin]]
name = "warren-snail"
path = "src/main.rs"

[features]
# An open snail holds the pages its rounds read, between rounds. Built without it, a snail holds
# none of its own, as inside PostgreSQL.
default = ["standalone"]
standalone = []
# Zones other than UTC, read from compiled zone files in a directory: the machine's, or one named.
# Built without it, a zone other than UTC is refused by name.
zones = []
# Text under a collation other than byte order: ICU's collators and glibc's locales, called as
# PostgreSQL calls them, the machine's ICU linked as PostgreSQL links it. Built without it, such a
# collation is refused by name.
collations = []

[dependencies]
sqlparser = { version = "0.63", default-features = false, features = ["std"] }
arrow = { version = "58", default-features = false }
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crc32fast = "1"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = ["fs"] }
errno = "0.3"
